name: meiro_sdk
description: Flutter SDK for collecting mobile events for Meiro Data Platform.
version: 0.1.0-stage
publish_to: none
homepage: https://github.com/meiroio/mobile_sdk_flutter
repository: https://github.com/meiroio/mobile_sdk_flutter
issue_tracker: https://github.com/meiroio/mobile_sdk_flutter/issues

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

platforms:
  android:
  ios:

dependencies:
  advertising_id: ^2.7.1
  connectivity_plus: ^6.1.4
  device_info_plus: ^11.3.0
  firebase_messaging: ^15.2.5
  flutter:
    sdk: flutter
  flutter_local_notifications: ^18.0.1
  http: ^1.3.0
  meta: ^1.15.0
  package_info_plus: ^8.2.1
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.2
  sqflite: ^2.4.1
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  webview_flutter: ^4.13.0

flutter:
  assets:
    - assets/in_app_runtime.js

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  test: ^1.25.8

topics:
  - analytics
  - cdp
  - events
  - push-notifications
