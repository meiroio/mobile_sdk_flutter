name: meiro_sdk_example
description: Example app for Meiro Flutter SDK.
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.5
  flutter:
    sdk: flutter
  meiro_sdk:
    path: ..

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
